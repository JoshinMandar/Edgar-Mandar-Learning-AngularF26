<div class="car-list">
  <h2>Carlist</h2>
  <p>Number of black cars: {{ blackCarCount() }}</p>
  @for (car of carList (); track car.vin) {
<app-car-list-item [car]="car"
(contentEvent)="carEvent($event)"/>
  } @empty {

    <p>NO CARRRSSSSSSSS!</p>
  }
  <h2>Black cars</h2>
  @for (car of blackCars(); track car.vin) {
    <p>{{ car.name }} - {{ car.colour }}</p>
  }
</div>
