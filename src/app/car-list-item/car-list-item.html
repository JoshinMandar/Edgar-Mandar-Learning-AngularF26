<div class="Car-card">
  <h3><a [routerLink]="['/cars', car().id]">{{ car().name }}</a></h3>

  @switch (car().carModel) {
    @case ('Honda') { <span class="Honda">Civic </span> }
    @case ('Toyota') { <span class="Toyota">Supra </span> }
    @case ('Ford') { <span class="Ford">Raptors </span> }
    @default {
      <span class="badge">Others</span>
    }
  }
  @if (car().colour) {
    <p class="Colour">Car Colour Available</p>
  } @else {
    <p class="Not Availabe">Not Avaialbe</p>
  }

  <a [routerLink]="['/cars/edit', car().id]">Edit</a>
  <button type="button" (click)="removeCar()">Delete</button>
</div>
