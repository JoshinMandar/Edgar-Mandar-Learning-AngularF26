<h2>Saved cars</h2>

@if (isLoading()) {
  <p>Loading cars...</p>
} @else {
  <ul class="saved-list">
    @for (car of savedCars(); track car.id) {
      <li appHighlight="#E3F2E1">
        <a [routerLink]="['/cars', car.id]">{{ car.name }}</a>
        <span class="make">{{ car.carModel }}</span>
      </li>
    } @empty {
      <li class="empty">You haven't saved any cars yet. Open a car and click "Save" to add it here.</li>
    }
  </ul>
}
