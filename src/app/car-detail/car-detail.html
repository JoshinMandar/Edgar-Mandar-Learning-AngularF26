@if (car(); as c) {
  <h2>{{ c.name }}</h2>
  <p>Model: {{ c.carModel }}</p>
  <p>Made in: {{ c.madeIn }}</p>
  <p>Colour: {{ c.colour }}</p>
  <p>VIN: {{ c.vin }}</p>

  @if (c.features?.length) {
    <h3>Features</h3>
    <ul>
      @for (f of c.features; track $index) {
        <li>{{ f }}</li>
      }
    </ul>
  }

  <a [routerLink]="['/cars/edit', c.id]">Edit</a>
} @else {
  <p>No car found with id {{ id() }}.</p>
}
<a routerLink="/cars">Back to list</a>
