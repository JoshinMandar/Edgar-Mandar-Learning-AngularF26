<div class="container">
  <h2>Car List</h2>

  @for (car of carList; track car.vin) {
    <div class="car-card">
      <h3>{{ car.name }}</h3>
      <p>{{ car.madeIn }}</p>
      <p>{{ car.carModel }}</p>

      @if (car.colour) {
        <p>Colour: {{car.colour}}</p>
      }
    </div>
  } @empty {
    <p>No available </p>
  }
    </div>
