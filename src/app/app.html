@if (errors.message(); as msg) {
  <div class="error-banner">
    <span>{{ msg }}</span>
    <button type="button" (click)="errors.clear()">Dismiss</button>
  </div>
}
<nav>
  <a routerLink="/cars">Cars</a>
  <a routerLink="/cars/new">Add Car</a>
  <button type="button" (click)="lock.toggle()">
    {{ lock.guardEnabled() ? 'Unlock Editing' : 'Lock Editing' }}
  </button>
  @if (loading.isLoading()) {
    <span>Loading....................</span>
  }
</nav>

<div class="container">
  <router-outlet />
</div>
